[package]
name = "nt61-winload"
version = "0.1.0"
edition = "2021"
description = "NT6.1.7601 UEFI OS Loader — winload.efi"
authors = ["NT6.1.7601 Team"]
publish = false

[dependencies]
uefi = { version = "0.37.0", features = ["alloc", "logger"] }
uefi-raw = "0.14.0"
nt61-bootfs = { path = "../bootfs" }

# The OS Loader (`winload.efi`) needs the same architecture
# features as `kernel_main` because the kernel-jump trampolines
# in `winload/src/arch/` call into the kernel's `kernel_main`
# symbol. We therefore enable the matching `nt61` feature per
# target triple. The `alloc` feature is required because
# `kernel_main` uses `Vec` / `String` for the registry hive /
# boot-driver descriptors it consumes from `BootInfo`.
[target.'cfg(target_arch = "x86_64")'.dependencies]
nt61 = { path = "../..", default-features = false, features = ["x86_64", "binary_panic", "alloc"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
nt61 = { path = "../..", default-features = false, features = ["aarch64", "binary_panic", "alloc"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
nt61 = { path = "../..", default-features = false, features = ["riscv64", "binary_panic", "alloc"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
nt61 = { path = "../..", default-features = false, features = ["loongarch64", "binary_panic", "alloc"] }

[[bin]]
name = "nt61-winload"
path = "src/main.rs"
test = false

[features]
# winload.efi is currently enabled for the target supported by the
# loader trampolines. As additional target shims land, the required
# feature set above can be expanded.
x86_64 = []
aarch64 = []
riscv64 = []
loongarch64 = []
log_level_warn = []
log_level_debug = ["log_level_warn", "nt61/log_level_debug"]

# Profile settings are inherited from the workspace root.
